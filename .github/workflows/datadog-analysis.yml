on:
  workflow_call:
    inputs:
      module_directory:
        required: true
        type: string

    secrets:
      dd_app_key:
        required: true
      dd_api_key:
        required: true

jobs:
  check-quality:
    runs-on: ubuntu-latest
    name: Datadog Static Analyzer
    steps:
      - name: Checkout
        uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 # v4.2.0
